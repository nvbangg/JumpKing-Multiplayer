spring.application.name=jumpking
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.config.import=optional:file:./config/
spring.sql.init.mode=never
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.cookie.secure=false
server.servlet.session.tracking-modes=cookie
app.allowed-origins=http://127.0.0.1:5173,http://127.0.0.1:8080
app.session-absolute-timeout=30d
app.auth-rate-per-minute=20
app.http-body-limit=16384
app.rate-bucket-limit=10000
app.fly-enabled=${FLY_ENABLED:false}
app.google-client-id=${GOOGLE_CLIENT_ID:382899145958-avvs1eb671tkgpquv1c7tfg18ru4e298.apps.googleusercontent.com}
app.network.handshakes-per-minute=30
app.network.connections-per-identity=2
app.network.connections-per-ip=32
app.network.connections=256
app.network.rooms=64
app.network.joins-per-minute=20
app.network.message-bytes=16384
app.network.messages-per-second=120
app.network.input-frames=120
app.network.control-messages=64
app.network.command-queue=240
app.network.worker-threads=4
app.network.send-threads=8
app.network.send-timeout-ms=5000
app.network.heartbeat-expiry-ms=30000
app.network.input-timeout-ms=500
app.network.room-lookups-per-minute=60
app.network.chat-code-points=200
app.network.chat-history=50
app.network.chat-interval-ms=1000
app.checkpoint-interval-ms=1000
app.persistence-retry-count=3
app.persistence-retry-delay-ms=1000
app.persistence-threads=2
app.persistence-queue=256
app.persistence-run-queue=16
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.mapper.allow-coercion-of-scalars=false
# Gửi Unicode ngoài BMP bằng UTF-8, tránh phình message thành các cặp escape surrogate.
spring.jackson.generator.combine-unicode-surrogates-in-utf8=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
